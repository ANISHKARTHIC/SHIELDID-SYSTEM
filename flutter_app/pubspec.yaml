name: venuepass_app
description: "VenuePass - Mobile Venue Identity Verification"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  camera: ^0.11.0+2
  local_auth: ^3.0.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  fl_chart: ^0.69.0
  mobile_scanner: ^6.0.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.0
  cached_network_image: ^3.4.1
  google_mlkit_face_detection: ^0.12.0
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  lottie: ^3.2.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  sqflite: ^2.4.3
  uuid: ^4.5.3
  dio: ^5.10.0
  path: ^1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: "assets/branding/app_icon_1024.png"
  web:
    generate: true
    image_path: "assets/branding/app_icon_1024_opaque.png"
    background_color: "#0A0A0B"
    theme_color: "#0A0A0B"

flutter_native_splash:
  color: "#0A0A0B"
  image: "assets/branding/logo_transparent_512.png"
  color_dark: "#0A0A0B"
  image_dark: "assets/branding/logo_transparent_512.png"
  android_12:
    color: "#0A0A0B"
    image: "assets/branding/logo_transparent_512.png"
    color_dark: "#0A0A0B"
    image_dark: "assets/branding/logo_transparent_512.png"
