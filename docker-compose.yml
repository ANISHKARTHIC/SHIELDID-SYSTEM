# `main` is tuned for a t3.micro free-tier demo box: 1GB RAM + swap as
# backstop, not primary memory. db(160M) + redis(48M) + backend(256M) +
# frontend(160M) = 624M hard-capped real RAM, leaving ai-service the rest
# of the 1GB plus swap for its model weights (see the ai-service service
# below for why it has no hard limit). The `high-power` branch targets a
# real t3.medium+ instance and is not this tight — do not port these
# limits over there, and don't port high-power's limits back here.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: venuepass_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-pub_entry_db}
    # Keep Postgres off the public interface — the backend reaches it over
    # the compose network by service name. Bind to loopback only so a t2/t3
    # instance's default security group doesn't need to open 5432 at all.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # t3.micro tuning: this branch targets a 1GB-RAM free-tier demo box
    # (with swap as backstop, not primary memory), so every service here is
    # trimmed as far as it'll go without breaking — ai-service (real
    # InsightFace+EasyOCR+torch inference) needs whatever real RAM can be
    # freed up from everything else. shared_buffers/work_mem below are
    # near Postgres' practical floor for a still-usable single-connection
    # workload.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=48MB"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "work_mem=2MB"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-pub_entry_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 160M
        reservations:
          memory: 96M

  redis:
    image: redis:7-alpine
    container_name: venuepass_redis
    command: [ "redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru" ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 48M
        reservations:
          memory: 24M

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      # buffalo_s (~160MB) + a 320px detector input instead of buffalo_l
      # (~600MB) + 640px — measured peak RSS for just loading this pack is
      # ~615MB (see commit message), which is already most of a t3.micro's
      # 1GB. buffalo_l would not fit at all. Every other service in this
      # file is trimmed specifically to leave this one as much real RAM as
      # possible; the rest lives in swap.
      args:
        INSIGHTFACE_MODEL_PACK: buffalo_s
        INSIGHTFACE_DET_SIZE: "320"
    container_name: venuepass_ai_service
    environment:
      # Single thread, not 2 — a t3.micro is 2 vCPU but both are needed for
      # everything else running concurrently; oversubscribing threads here
      # just adds context-switch overhead without real parallelism to use.
      OMP_NUM_THREADS: "1"
      ORT_NUM_THREADS: "1"
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/docs" ]
      interval: 30s
      timeout: 30s
      start_period: 180s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        # No hard limit: on a 1GB host, capping ai-service tightly just
        # gets it OOM-killed by Docker instead of the kernel swapping it
        # out — letting it use whatever's actually available (real RAM,
        # then swap) is the whole point of this branch's trade-off. The
        # other services' tight limits below are what actually protects it.
        reservations:
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: venuepass_backend
    # Seed the database (default venue + bootstrap super_admin from
    # SEED_ADMIN_EMAIL/SEED_ADMIN_PASSWORD below) before starting the API —
    # backend/seed.py is idempotent, so this is safe to run on every
    # container start/restart. Single uvicorn worker (not 2) — a t3.micro
    # has no spare RAM for a second worker process.
    command: >
      sh -c "python -m backend.seed &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 1"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-pub_entry_db}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      # Real AWS S3 — no endpoint override, no static keys. Requires the
      # EC2 instance profile to carry deploy/aws/s3-iam-policy.json (see
      # README "AWS Deployment" section).
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?S3_BUCKET_NAME must be set in .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AI_SERVICE_URL: http://ai-service:8001
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      # Bootstrap super_admin — created once on first startup if no account
      # with this email exists yet (backend/seed.py, run by
      # backend/entrypoint.sh before uvicorn starts). Change the password
      # before deploying anywhere reachable from outside your own machine.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@venuepass.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  frontend:
    build:
      context: .
      dockerfile: frontend/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: venuepass_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 160M
        reservations:
          memory: 96M

volumes:
  postgres_data:
  redis_data:
