# This branch (high-power) is the full-power, accurate deployment target —
# sized for a real t3.medium+ instance (buffalo_l InsightFace at 640px,
# comfortable per-service memory limits). `main` carries a deliberately
# trimmed-down config for a free-tier t3.micro demo (buffalo_s/320px,
# every service capped to its floor) — don't port main's sizing here.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: venuepass_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-pub_entry_db}
    # Keep Postgres off the public interface — the backend reaches it over
    # the compose network by service name. Bind to loopback only so a t2/t3
    # instance's default security group doesn't need to open 5432 at all.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Small-instance tuning: Postgres defaults assume much more RAM than a
    # t3.medium has to spare once ai-service and backend are running.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "work_mem=4MB"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-pub_entry_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: venuepass_redis
    command: [ "redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru" ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 160M
        reservations:
          memory: 96M

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: venuepass_ai_service
    environment:
      # Keep CPU thread pools in check — PyTorch/onnxruntime default to
      # using every core, which starves the other containers on a 2 vCPU box.
      OMP_NUM_THREADS: "2"
      ORT_NUM_THREADS: "2"
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/docs" ]
      interval: 30s
      timeout: 30s
      start_period: 120s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 1024M

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: venuepass_backend
    # Seed the database (default venue + bootstrap super_admin from
    # SEED_ADMIN_EMAIL/SEED_ADMIN_PASSWORD below) before starting the API —
    # backend/seed.py is idempotent, so this is safe to run on every
    # container start/restart.
    command: >
      sh -c "python -m backend.seed &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 2"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-pub_entry_db}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      # Real AWS S3 — no endpoint override, no static keys. Requires the
      # EC2 instance profile to carry deploy/aws/s3-iam-policy.json (see
      # README "AWS Deployment" section).
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?S3_BUCKET_NAME must be set in .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AI_SERVICE_URL: http://ai-service:8001
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      # Bootstrap super_admin — created once on first startup if no account
      # with this email exists yet (backend/seed.py, run by
      # backend/entrypoint.sh before uvicorn starts). Change the password
      # before deploying anywhere reachable from outside your own machine.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@venuepass.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: .
      dockerfile: frontend/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: venuepass_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

volumes:
  postgres_data:
  redis_data:
